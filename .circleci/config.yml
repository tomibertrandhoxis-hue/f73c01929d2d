version: 2.1

jobs:
  Boreal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load biome
          command: |
            printf 'taiga 1\n' > boreal.cfg
      - run:
          name: Build ecosystem sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Boreal -j2
      - run:
          name: Grow boreal forest
          command: LIONSS_LP=1 ./build/Boreal --config boreal.cfg --years 50
  Halcyon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load calm sea
          command: |
            printf 'swell 0.1\n' > hal.cfg
      - run:
          name: Build ocean sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Halcyon -j2
      - run:
          name: Render halcyon calm
          command: LIONSS_LP=1 ./build/Halcyon --config hal.cfg --fetch 10
  scala-specialize:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
